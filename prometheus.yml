global:
  scrape_interval:     5s      # scrape every 5 seconds for near-realtime
  evaluation_interval: 5s

scrape_configs:
  - job_name: "textile_api"
    static_configs:
      - targets: ["textile-api:8000"]   # Docker service name resolves internally
    metrics_path: /metrics
    scrape_interval: 5s

  # scrape Prometheus itself too (optional, useful for debugging)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
